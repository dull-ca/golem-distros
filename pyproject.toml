[project]
name = "golem-distros"
version = "1.0.0"
description = "Debian Trixie qcow2 images with golemd, for OVH bare metal and DigitalOcean droplets"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0,<15.0.0",
    "semver>=3.0.0,<4.0.0",
    "typer>=0.27.1,<1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golem_distros"]
