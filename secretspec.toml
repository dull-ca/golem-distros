[project]
name = "golem-distros"
revision = "1.0"

[profiles.default]
GOLEM_DISTROS_IMAGE_BUCKET = { description = "S3 bucket name that golem-distros publishes images and manifests to", required = true }
GOLEM_DISTROS_IMAGE_REGION = { description = "S3 region of the golem-distros image bucket", required = true }
GOLEM_DISTROS_IMAGE_ENDPOINT = { description = "S3 endpoint host rclone uploads to, for example s3.gra.io.cloud.ovh.net", required = true }
GOLEM_DISTROS_IMAGE_BASE_URL = { description = "Base URL a consumer fetches published images from, for example https://golem-distros.s3.gra.io.cloud.ovh.net", required = true }
GOLEM_DISTROS_IMAGE_PROVIDER = { description = "rclone S3 provider name, such as Other for a generic S3-compatible service", required = true }
GOLEM_DISTROS_IMAGE_ACL = { description = "Object ACL rclone applies on upload, public-read or private", required = true }
GOLEM_DISTROS_IMAGES_ACCESS_KEY_ID = { description = "Access key for the golem-distros image bucket", required = true }
GOLEM_DISTROS_IMAGES_SECRET_ACCESS_KEY = { description = "Secret key for the golem-distros image bucket", required = true }
